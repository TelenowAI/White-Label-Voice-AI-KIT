          description: Queued; it goes within seconds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentWebhookDeliveries' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/kit/console/agents/{agentId}/webhooks/{webhookId}/deliveries:
    get:
      operationId: listAgentWebhookDeliveries
      summary: The latest tries to this address, newest first. Never what was in them.
      security: []
      parameters:
        - { $ref: '#/components/parameters/AgentId' }
        - { name: webhookId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: The tries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentWebhookDeliveries' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/console/agents/{agentId}/webhooks/{webhookId}/deliveries/{deliveryId}/replay:
    post:
      operationId: replayAgentWebhookDelivery
      summary: Send one that has finished again, and answer the latest tries.
      description: 409 while it is still being tried, when the service has this off, or when too many were sent in the last hour.
      security: []
      parameters:
        - { $ref: '#/components/parameters/AgentId' }
        - { name: webhookId, in: path, required: true, schema: { type: string } }
        - { name: deliveryId, in: path, required: true, schema: { type: string } }
      responses:
        '202':
          description: Queued; it goes within seconds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentWebhookDeliveries' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/console/agents/{agentId}/knowledge:
    put:
      operationId: setAgentKnowledge
      summary: The knowledge bases the agent answers from, all at once ([] answers from none).
      description: Only the account's own bases. Sent to the voice platform at once; `syncState` pending while it waits for a base still being saved.
      security: []
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [knowledgeBaseIds]
              properties:
                knowledgeBaseIds: { type: array, items: { type: string } }
      responses:
        '200':
          description: Saved (see `syncState`).
          content:
            application/json:
              schema:
                type: object
                required: [knowledgeBases, syncState, syncError]
                properties:
                  knowledgeBases: { type: array, items: { $ref: '#/components/schemas/KnowledgeBaseRef' } }
                  syncState: { type: string, enum: [pending, synced, failed] }
                  syncError: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/kit/console/agents/{agentId}/call-form:
    get:
      operationId: getAgentCallForm
      summary: "What Call someone offers for an agent: the account's numbers to call from, the agent's own, and the details its words use."
      security: []
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '200':
          description: The form.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentCallForm' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/console/agents/{agentId}/calls:
    post:
      operationId: placeAgentCall
      summary: The agent calls one person now.
      description: >
        The number needs its + and country code. 409 while the service is paused or the agent is not saved yet; 422 for
        a number on the do-not-call list, without consent on file while calls need it, or refused by the voice
        platform, for a caller ID not the account's, for an agent with no number of its own when none is picked, and
        for details the agent does not use or needs; 429 when the number called from is on as many calls as it takes at
        once, or the member asked for many in a minute; 503 when no call could be placed. The call is in listCalls at
        once, with who asked for it.
      security: []
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [number]
              properties:
                number: { type: string, maxLength: 40 }
                callerId: { type: string, format: uuid, nullable: true, description: 'One of the account''s numbers (getAgentCallForm `callerIds`); none: the agent''s own.' }
                variables: { type: object, nullable: true, additionalProperties: { type: string, nullable: true, maxLength: 500 } }
                openingLine: { type: string, nullable: true, maxLength: 1000, description: 'Instead of the agent''s own, for this call.' }
                machine: { type: string, nullable: true, enum: [voicemail, hang_up], description: 'None: as the agent is set up.' }
      responses:
        '201':
          description: Placed.
          content:
            application/json:
              schema:
                type: object
                required: [callId]
                properties:
                  callId: { type: string, format: uuid }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/kit/console/campaigns:
    get:
      operationId: listCampaigns
      summary: "The account's campaigns, newest first."
      security: []
      responses:
        '200':
          description: The campaigns.
          content:
            application/json:
              schema:
                type: object
                required: [campaigns, limits]
                properties:
                  campaigns: { type: array, items: { $ref: '#/components/schemas/Campaign' } }
                  limits:
                    type: object
                    description: What a new campaign starts from and what this backend takes.
                    required: [nameMaxLength, concurrency, maxAttempts, machineDetection, phoneColumns, importMaxBytes, importMaxRows]
                    properties:
                      nameMaxLength: { type: integer }
                      concurrency: { $ref: '#/components/schemas/CampaignLimit' }
                      maxAttempts: { $ref: '#/components/schemas/CampaignLimit' }
                      machineDetection: { type: array, items: { type: string }, description: The voicemail handling a campaign can take. }
                      phoneColumns: { type: array, items: { type: string }, description: 'The CSV header names that hold the number (the first found wins); every other column is a variable.' }
                      importMaxBytes: { type: integer, description: The largest call list (CSV) one addCampaignTargets takes. }
                      importMaxRows: { type: integer, description: How many people one addCampaignTargets may add. }
                      retryGapMinutes:
                        type: object
                        required: [default, min, max]
                        properties:
                          default: { type: integer }
                          min: { type: integer }
                          max: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    post:
      operationId: createCampaign
      summary: Make a campaign (a draft, saved at the voice platform straight away with the account's own key).
      description: Add people to call (addCampaignTargets), then start it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, agentId]
              properties:
                name: { type: string, maxLength: 120 }
                agentId: { type: string, format: uuid, description: One of the account's agents. }
                callerId: { type: string, format: uuid, nullable: true, description: 'One of the account''s numbers.' }
                concurrency: { type: integer, minimum: 1, maximum: 50 }
                windowStart: { type: string, nullable: true, description: 'The daily calling window (HH:MM, with windowEnd), in timezone.' }
                windowEnd: { type: string, nullable: true }
                timezone: { type: string, nullable: true, description: 'An IANA time zone, older names (Asia/Calcutta) too; the backend''s own when left out.' }
                machineDetection: { type: string, enum: [off, voicemail, hangup] }
                maxAttempts: { type: integer, minimum: 1, maximum: 10 }
                retryGapMinutes: { type: integer, minimum: 1, maximum: 60, description: How long before someone is tried again; each attempt doubles it. }
                retryOnNoAnswer: { type: boolean }
      responses:
        '201':
          description: Made (see `status`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/kit/console/campaigns/{campaignId}:
    get:
      operationId: getCampaign
      summary: One campaign.
      security: []
      parameters: [{ $ref: '#/components/parameters/CampaignId' }]
      responses:
        '200':
          description: The campaign.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateCampaign
      summary: Change a campaign's settings. What is left out stays; a window and a caller id of null clear them.
      description: >-
        It applies to the next calls. A window goes as both of its ends. Not for a campaign that was cancelled, nor while its last change is still being saved (409).
        If the voice platform refuses it, nothing changes (409). If it cannot be reached, it goes when it can, and `syncState` says so.
      security: []
      parameters: [{ $ref: '#/components/parameters/CampaignId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                callerId: { type: string, format: uuid, nullable: true, description: 'One of the account''s numbers.' }
                concurrency: { type: integer, minimum: 1, maximum: 50 }
                windowStart: { type: string, nullable: true, description: 'The daily calling window (HH:MM, with windowEnd; they differ). Null for any time.' }
                windowEnd: { type: string, nullable: true }
                timezone: { type: string, nullable: true, description: 'An IANA time zone, older names (Asia/Calcutta) too.' }
                machineDetection: { type: string, enum: [off, voicemail, hangup] }
                maxAttempts: { type: integer, minimum: 1, maximum: 10 }
                retryGapMinutes: { type: integer, minimum: 1, maximum: 60 }
                retryOnNoAnswer: { type: boolean }
      responses:
        '200':
          description: The campaign (see `syncState`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteCampaign
      summary: Delete a campaign (a running one is stopped first; calls in progress finish).
      security: []
      parameters: [{ $ref: '#/components/parameters/CampaignId' }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/console/campaigns/{campaignId}/targets:
    get:
      operationId: listCampaignTargets
      summary: The people a campaign calls, in the order they were added, and how each call went.
      security: []
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { $ref: '#/components/parameters/CampaignPeopleShow' }
      responses:
        '200':
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [targets, total, page, perPage, counts]
                properties:
                  targets: { type: array, items: { $ref: '#/components/schemas/CampaignTarget' } }
                  total: { type: integer, description: How many there are of those asked for. }
                  page: { type: integer }
                  perPage: { type: integer }
                  counts:
                    type: object
                    description: How many of all its people stand where.
                    required: [waiting, answered, unanswered, failed]
                    properties:
                      waiting: { type: integer }
                      answered: { type: integer }
                      unanswered: { type: integer, description: 'Nobody answered, it was busy, or a machine did.' }
                      failed: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    post:
      operationId: addCampaignTargets
      summary: Add people to call from a CSV.
      description: >
        A header row; the number in a column named phone_number or phone; every other column becomes a variable the
        agent can use. Lines with no number are skipped. Sent to the voice platform at once (one on the do-not-call list
        is never called). 409 once the campaign has finished.
      security: []
      parameters: [{ $ref: '#/components/parameters/CampaignId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: { type: string }
      responses:
        '200':
          description: Added.
          content:
            application/json:
              schema:
                type: object
                required: [added, skipped, noCountryCode]
                properties:
                  added: { type: integer }
                  skipped: { type: integer, description: Lines without a number. }
                  noCountryCode: { type: integer, description: Added with no + and country code. Calls are matched to consent exactly, so consent on file is never matched to these. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/kit/console/campaigns/{campaignId}/targets/export:
    get:
      operationId: exportCampaignTargets
      summary: A campaign's people as a CSV file, with how each call went and each of their columns.
      description: The first column is the number under a name addCampaignTargets takes, so the file can be a new campaign's list.
      security: []
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { $ref: '#/components/parameters/CampaignPeopleShow' }
      responses:
        '200':
          description: The file.
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/kit/console/campaigns/{campaignId}/retry:
    post:
      operationId: retryCampaign
      summary: Call again those nobody answered, or everyone whose call did not go through.
      description: >-
        Every call costs money, so it is asked for and answered once, never tried again by itself. A finished campaign reopens and calls them; a paused one stays paused.
        A 503 may have taken effect: look at who is waiting before asking again.
      security: []
      parameters: [{ $ref: '#/components/parameters/CampaignId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: { type: string, enum: [unanswered, all] }
      responses:
        '200':
          description: How many will be called again.
          content:
            application/json:
              schema:
                type: object
                required: [retried, campaign]
                properties:
                  retried: { type: integer }
                  campaign: { $ref: '#/components/schemas/Campaign' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '503': { $ref: '#/components/responses/Error' }

  /api/kit/console/campaigns/{campaignId}/progress:
    get:
      operationId: getCampaignProgress
      summary: How a campaign went so far, read live from the voice platform.
      security: []
      parameters: [{ $ref: '#/components/parameters/CampaignId' }]
      responses:
        '200':
          description: The figures.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignProgress' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/kit/console/campaigns/{campaignId}/start:
    post:
      operationId: startCampaign
      summary: Start (or resume) a campaign.
      description: Only a draft or a paused campaign with people to call; never while the account's service is paused (409 says why).
