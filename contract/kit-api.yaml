        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/console/workspace:
    post:
      operationId: selectWorkspace
      summary: Work in another of the user's accounts.
      description: >
        404 when the user is not a member of it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceList' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/kit/console/home:
    get:
      operationId: getConsoleHome
      summary: "The current account's home: its name and status, the user's role, and whether the service is paused for it."
      description: >
        403 for a signed-in user who belongs to no account. A pause is told without naming the voice platform or the operator's own billing.
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsoleHome' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/console/team:
    get:
      operationId: getTeam
      summary: The current account's members and pending invites.
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/console/team/invites:
    post:
      operationId: inviteTeamMember
      summary: Invite someone to the current account (its managers only).
      description: >
        As inviteCustomerMember; 403 for a member who does not manage the account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, description: "One of the team's roles (owner, member, …)." }
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteCreated' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/kit/console/team/invites/{inviteId}:
    delete:
      operationId: revokeTeamInvite
      summary: Withdraw a pending invite of the current account (its managers only).
      security: []
      parameters: [{ $ref: '#/components/parameters/InviteId' }]
      responses:
        '204': { description: Done. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/console/team/members/{userId}:
    delete:
      operationId: removeTeamMember
      summary: Remove someone from the current account (its managers only).
      description: >
        409 when they are its last manager.
      security: []
      parameters: [{ $ref: '#/components/parameters/UserId' }]
      responses:
        '204': { description: Done. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/console/agents/settings-form:
    get:
      operationId: getAgentSettingsForm
      summary: What the agent form offers - how an agent speaks and listens, by group, and whether transfers are allowed.
      description: >
        Each field's `name` is its key in AgentSettings, and its `value` is always null: an agent's own values are in its `settings`.
        A checkbox is a boolean there. An empty choice or number is null there.
      security: []
      responses:
        '200':
          description: The form.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentSettingsForm' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/kit/console/agents:
    get:
      operationId: listAgents
      summary: The current account's agents, the latest changed first, from the kit's own database.
      description: >
        Every member may read and build them. Read from the kit's DB, never from the voice platform (§3.8 b).
      security: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: One page of agents.
          content:
            application/json:
              schema:
                type: object
                required: [agents, total, page, perPage]
                properties:
                  agents: { type: array, items: { $ref: '#/components/schemas/Agent' } }
                  total: { type: integer }
                  page: { type: integer }
                  perPage: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    post:
      operationId: createAgent
      summary: Build an agent for the current account.
      description: >
        Saved in the kit at once and made at the voice platform straight away with the account's own key. Its voice
        setup (`stack`) is the one sent (chosen whole from getStackChoices and listVoices), else the operator's defaults
        for new agents, else the platform's recommendation; until it is made
        the agent answers `syncState: pending` (the kit keeps trying), or `failed` with the reason. 409 while the
        account is still being set up.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: string, nullable: true, maxLength: 500 }
                settings: { $ref: '#/components/schemas/AgentSettingsInput' }
                systemPrompt: { type: string, nullable: true, description: "The agent's instructions, up to the backend's limit (20,000 characters by default)." }
                llmProvider: { type: string, description: 'A key from getStackChoices. The stack is chosen whole: these five together, or none.' }
                llmModel: { type: string }
                sttProvider: { type: string }
                ttsProvider: { type: string }
                ttsVoice: { type: string, description: 'A voice id from listVoices, of that provider.' }
                providerSettings: { $ref: '#/components/schemas/ProviderSettingsInput' }
                realtime: { $ref: '#/components/schemas/RealtimeInput' }
      responses:
        '201':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/kit/console/agents/{agentId}:
    get:
      operationId: getAgent
      summary: One of the current account's agents.
      description: >
        404 for an agent of another account, or a deleted one.
      security: []
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateAgent
      summary: Change an agent; only the fields sent are changed, and only what changed is sent on.
      security: []
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 120 }
                description: { type: string, nullable: true, maxLength: 500 }
                systemPrompt: { type: string, nullable: true }
                isActive: { type: boolean }
                settings: { $ref: '#/components/schemas/AgentSettingsInput' }
                llmProvider: { type: string, description: 'A key from getStackChoices. The stack is chosen whole: these five together, or none.' }
                llmModel: { type: string }
                sttProvider: { type: string }
                ttsProvider: { type: string }
                ttsVoice: { type: string, description: 'A voice id from listVoices, of that provider.' }
                providerSettings: { $ref: '#/components/schemas/ProviderSettingsInput' }
                realtime: { $ref: '#/components/schemas/RealtimeInput' }
      responses:
        '200':
          description: Saved (see `syncState`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteAgent
      summary: Delete an agent, here and at the voice platform.
      security: []
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '204': { description: Done. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/console/agents/{agentId}/retry:
    post:
      operationId: retryAgent
      summary: Try a refused change of an agent again.
      description: >
        409 when nothing failed.
      security: []
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '200':
          description: Tried (see `syncState`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/console/agents/{agentId}/test-call:
    post:
      operationId: startTestCall
      summary: Start a test call with an agent from the browser.
      description: >
        Answers the session the console joins (`@telenow/client`'s `session` option); no key reaches the browser.
        409 while the service is paused for the account or the agent is not saved yet, 429 when too many test calls
        run at once, 503 when no call could be started.
      security: []
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '200':
          description: Started.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session: { $ref: '#/components/schemas/TestSession' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/kit/console/agents/{agentId}/check:
    post:
      operationId: checkAgentStack
      summary: "Check the agent's voice setup: each part (language model, listening, voice) connected to now, said in the kit's own words, and kept as its last check."
      description: >
        Each part is ok, failed (with why, never a provider's own message), or not checked (a provider with no check of its
        own: try a test call). 409 while the agent is still being saved or the service is paused for the account; 429 when
        it was checked a moment ago, or the member asked for many in a minute; 503 when it cannot be checked now.
      security: []
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '200':
          description: The check.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StackCheck' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/kit/console/agents/{agentId}/voice-preview:
    post:
      operationId: previewAgentVoice
      summary: Hear the agent — a short clip in its own voice, made on demand with the account's own key and never stored.
      description: 409 while the agent is still being saved, or while the service is paused for the account; 429 when previews come too fast.
      security: []
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, nullable: true, maxLength: 500, description: 'Default: a short greeting.' }
      responses:
        '200':
          description: The clip.
          content:
            audio/*:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/kit/console/agents/{agentId}/flow:
    get:
      operationId: getAgentFlow
      summary: This agent's call steps, in use and being worked on, and what may be chosen. Never a key.
      security: []
      parameters:
        - { $ref: '#/components/parameters/AgentId' }
      responses:
        '200':
          description: The steps.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentFlowState' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

    delete:
      operationId: unpublishAgentFlow
      summary: Stop using call steps, so calls use the agent's own instructions from the next call. A draft stays.
      security: []
      parameters:
        - { $ref: '#/components/parameters/AgentId' }
      responses:
        '200':
          description: The steps now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentFlowState' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/console/agents/{agentId}/flow/draft:
    put:
      operationId: saveAgentFlowDraft
      summary: Keep steps being worked on. A draft never runs, and need not be finished; only the kinds of its fields are checked. A key typed is sealed at once.
      security: []
      parameters:
        - { $ref: '#/components/parameters/AgentId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flow]
              properties:
                flow: { $ref: '#/components/schemas/AgentFlowGraph' }
      responses:
        '200':
          description: The steps now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentFlowState' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      operationId: discardAgentFlowDraft
      summary: Throw a draft away.
      security: []
      parameters:
        - { $ref: '#/components/parameters/AgentId' }
      responses:
        '200':
          description: The steps now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentFlowState' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/kit/console/agents/{agentId}/flow/check:
    post:
      operationId: checkAgentFlow
      summary: Check steps as a call would read them, without saving. What would stop them is a 422 beside its field; what may misbehave on a call comes back as warnings.
      security: []
      parameters:
        - { $ref: '#/components/parameters/AgentId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flow]
              properties:
                flow: { $ref: '#/components/schemas/AgentFlowGraph' }
      responses:
        '200':
          description: They would run.
          content:
            application/json:
              schema:
                type: object
                required: [warnings]
                properties:
                  warnings: { type: array, items: { $ref: '#/components/schemas/AgentFlowWarning' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/kit/console/agents/{agentId}/flow/publish:
    post:
      operationId: publishAgentFlow
      summary: Put steps in use from the next call, after the same check. A draft is cleared once they are sent; if they are refused nothing changes and the work is kept as a draft.
      security: []
      parameters:
        - { $ref: '#/components/parameters/AgentId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flow]
              properties:
                flow: { $ref: '#/components/schemas/AgentFlowGraph' }
      responses:
        '200':
          description: The steps now, with any warnings. syncState says whether they have gone through yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentFlowState' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /api/kit/console/agents/{agentId}/versions:
    get:
      operationId: listAgentVersions
      summary: This agent's versions, newest first, the first being the one in use. Each save that changes something keeps one. At most the voice platform's newest 100.
      security: []
      parameters:
        - { $ref: '#/components/parameters/AgentId' }
      responses:
        '200':
          description: The versions.
          content:
            application/json:
              schema:
                type: object
                required: [versions, lastRestore]
                properties:
                  versions:
                    type: array
                    items:
                      type: object
                      required: [version, at, name, kind, restoredFrom, current]
                      properties:
                        version: { type: integer }
                        at: { type: string, nullable: true }
                        name: { type: string, nullable: true, description: The agent's name in that version. }
                        kind: { type: string, enum: [created, changed, restored] }
                        restoredFrom: { type: integer, nullable: true }
                        current: { type: boolean }
                  lastRestore:
                    type: object
                    nullable: true
                    description: What the last putting back left as it was, in words, for a day. Null when it left nothing out.
                    required: [version, kept]
                    properties:
                      version: { type: integer }
                      kept: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/console/agents/{agentId}/versions/{version}/changes:
    get:
      operationId: getAgentVersionChanges
      summary: What this version changed from the one before it, in words. Keys are never shown, long text is cut, and a setting with nothing to show says only that it changed.
      security: []
      parameters:
        - { $ref: '#/components/parameters/AgentId' }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The changes. Empty when only settings not listed here changed.
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes:
                    type: array
                    items:
                      type: object
                      required: [label, from, to]
                      properties:
                        label: { type: string }
                        from: { type: string, nullable: true }
                        to: { type: string, nullable: true }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/console/agents/{agentId}/versions/{version}/results:
    get:
      operationId: getAgentVersionResults
      summary: How calls went while this version was in use, beside the version before it.
      security: []
      parameters:
        - { $ref: '#/components/parameters/AgentId' }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The results.
          content:
            application/json:
              schema:
                type: object
                required: [current, previous]
                properties:
                  current: { $ref: '#/components/schemas/AgentVersionWindow' }
                  previous: { allOf: [{ $ref: '#/components/schemas/AgentVersionWindow' }], nullable: true, description: Null for the first version. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/console/agents/{agentId}/versions/{version}/restore:
    post:
      operationId: restoreAgentVersion
      summary: Put the agent back to this version, kept as a new version. Everything in it comes back as it was, saved keys included. What may not come back is then taken off, and lastRestore says so.
      description: 'Taken off: a transfer while the operator has them off, a hand-over to an agent since deleted, and a voice setup no longer offered, where the current one stays. Knowledge, web addresses and who is emailed are not part of a version.'
      security: []
      parameters:
        - { $ref: '#/components/parameters/AgentId' }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The agent. syncState says whether it has gone through yet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error', description: 'The agent is not at the voice platform yet, its last change is still being saved, the version is the one in use, or the voice platform refused it.' }

  /api/kit/console/agents/{agentId}/webhooks:
    get:
      operationId: listAgentWebhooks
      summary: The web addresses this agent's finished calls are sent to, and which events may be chosen.
      description: A secret still unseen is answered this once, then gone. `lastOkAt`, `failing` and `stopped` come from the voice platform and read as nothing when it cannot be read just now.
      security: []
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      responses:
        '200':
          description: The addresses.
          content:
            application/json:
              schema:
                type: object
                required: [webhooks, events]
                properties:
                  webhooks: { type: array, items: { $ref: '#/components/schemas/AgentWebhook' } }
                  events: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      operationId: addAgentWebhook
      summary: Send this agent's finished calls to a web address too. Its secret is in the answer this once.
      description: 422 names the field. An address cannot be changed, only removed and added again, with a new secret.
      security: []
      parameters: [{ $ref: '#/components/parameters/AgentId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, maxLength: 2048 }
                events: { type: array, minItems: 1, items: { type: string, enum: [call.completed, call.analyzed] } }
