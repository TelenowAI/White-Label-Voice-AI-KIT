openapi: 3.0.3
info:
  title: voice-kit API
  version: 0.41.0
  description: >
    The API every voice-kit backend serves (Laravel first, Node later) and the console calls. It is the
    contract both stacks are held to: `contract/tests` sends real requests to a running backend and checks
    every answer against this document — the status is documented, the body is valid, and it carries no
    field the document does not declare.


    The browser never holds a Telenow key: everything Telenow-backed goes through this API, which calls
    Telenow with the key of the customer's own sub-account.


    Signing in uses a session cookie on the console's own origin. A request that changes something
    (POST, PUT, PATCH, DELETE) on a session route echoes the `XSRF-TOKEN` cookie in an `X-XSRF-TOKEN`
    header; without it the backend answers 419.
servers:
  - url: http://127.0.0.1:8000
    description: A local backend

paths:
  /api/kit/health:
    get:
      operationId: getHealth
      summary: Is the backend up, and is it installed?
      description: >
        Answers before and after the setup wizard has run, with no credentials. `installed` is false until
        the wizard finishes; the console sends a visitor to the wizard while it is.
      security: []
      responses:
        '200':
          description: Up.
          content:
            application/json:
              schema:
                type: object
                required: [status, installed, version]
                properties:
                  status: { type: string, enum: [ok] }
                  installed: { type: boolean }
                  version: { type: string, description: "The kit's own release version." }

  /api/kit/brand:
    get:
      operationId: getBrand
      summary: The operator's brand, for theming the console and the website.
      description: >
        Public: the console applies it before anyone signs in. Every value comes from the operator's settings;
        before the wizard has set them, the backend answers its defaults. `colors` are CSS colour values keyed
        by role; the console sets each as a CSS variable, so a brand change needs no rebuild.
      security: []
      responses:
        '200':
          description: The brand.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brand' }

  /api/kit/setup:
    get:
      operationId: getSetup
      summary: The setup wizard's steps, each with its status, form and findings.
      description: >
        Open until the wizard finishes; then 404 (the installer locks itself). The steps run in order; the
        first that is not done is where the operator is. Every step declares its own form (`fields`), so the
        console renders any step without knowing it. A step whose `access` is `owner` shows its saved values
        and `facts` only to the signed-in owner.
      security: []
      responses:
        '200':
          description: The wizard.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupState' }
        '404': { $ref: '#/components/responses/Error' }

  /api/kit/setup/steps/{step}:
    post:
      operationId: submitSetupStep
      summary: Submit one step's form.
      description: >
        Body: the step's field values by field name. Answers the whole wizard again, since one step can
        change others. 409 when an earlier step is not done, or when a step that only runs before the install
        has an owner (database, admin) is sent again. 401/403 when an owner step is sent by someone who is
        not the signed-in owner. 422 names each field that was refused. After the `finish` step the answer
        says `installed: true` and the wizard's routes answer 404 from then on.
      security: []
      parameters:
        - name: step
          in: path
          required: true
          schema: { type: string, example: brand }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Saved; the wizard as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetupState' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/kit/session:
    get:
      operationId: getSession
      summary: Who is signed in, if anyone.
      description: Also sets the `XSRF-TOKEN` cookie the console echoes on writes.
      security: []
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
    post:
      operationId: signIn
      summary: Sign in with email and password.
      description: Wrong credentials answer 422 on `email`, never saying which part was wrong. Repeated tries are slowed (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                captchaToken: { type: string, description: 'The bot check widget''s token, when the bot check guards this form (brand `captcha.forms`).' }
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      operationId: signOut
      summary: Sign out.
      security: []
      responses:
        '204': { description: Signed out (also when nobody was signed in). }

  /api/kit/password/forgot:
    post:
      operationId: forgotPassword
      summary: Ask for a link to choose a new password.
      description: >
        Answers 202 the same whether or not an account uses the address; the link is made and emailed after the answer.
        With passwords off (brand `signInPassword` false) a customer gets no link, since finishing one signs them in;
        staff always do. 409 when the platform cannot send email (getBrand `passwordReset` is false). Repeated asking
        is slowed (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                captchaToken: { type: string, description: 'The bot check widget''s token, when the bot check guards this form (brand `captcha.forms`).' }
                email: { type: string, format: email }
      responses:
        '202':
          description: Asked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }

  /api/kit/password/reset/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string }, description: "The link's secret, from the email." }
    get:
      operationId: getPasswordReset
      summary: Whose password a reset link sets, and until when it works.
      description: Unknown, used and expired links all answer the same 404.
      security: []
      responses:
        '200':
          description: The link works.
          content:
            application/json:
              schema:
                type: object
                required: [email, expiresAt]
                properties:
                  email: { type: string }
                  expiresAt: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    post:
      operationId: resetPassword
      summary: Set a new password with a reset link, and sign in.
      description: The link works once. The person's other sessions end. Unknown, used and expired links answer 404, as does a customer's link once passwords are off.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, description: 'At least the platform''s minimum length.' }
      responses:
        '200':
          description: Set, and signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }

  /api/kit/signup:
    get:
      operationId: getSignupForm
      summary: The sign-up form, as the operator set it.
      description: >
        Closed (or with no way to send email) answers `open` false and no fields. The sign-in providers a person may
        also sign up with are the brand's `signInWith` (startSso): someone they vouch for with no account is sent on to
        finish signing up (getProviderSignup).
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignupForm' }
        '409': { $ref: '#/components/responses/Error' }
    post:
      operationId: signUp
      summary: Sign up. A link to confirm the address is emailed.
      description: >
        The body is the form's fields by name (`answers.<key>` nested under `answers`). Answers 202 the same whether or
        not the address already has an account (that person is emailed instead); nothing is made until the address is
        confirmed (verifySignup). 409 when sign-ups are closed. Repeated sign-ups are slowed (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, accountName]
              properties:
                captchaToken: { type: string, description: 'The bot check widget''s token, when the bot check guards this form (brand `captcha.forms`).' }
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string }
                accountName: { type: string }
                answers: { type: object, additionalProperties: { type: string } }
                terms: { type: string, description: '"1" when the terms box is ticked.' }
      responses:
        '202':
          description: Asked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }

  /api/kit/signup/verify/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string }, description: "The link's secret, from the email." }
    get:
      operationId: getSignupVerification
      summary: The sign-up a confirmation link is for.
      description: Unknown, used and expired links all answer the same 404.
      security: []
      responses:
        '200':
          description: The link works.
          content:
            application/json:
              schema:
                type: object
                required: [email, name, accountName]
                properties:
                  email: { type: string }
                  name: { type: string }
                  accountName: { type: string }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    post:
      operationId: verifySignup
      summary: Confirm the address. The account is made and the person signed in — or, in approval mode, the sign-up waits for staff.
      description: The link works once (404 after). 409 when the address got an account meanwhile.
      security: []
      responses:
        '200':
          description: Confirmed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignupConfirmed' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/kit/signup/phone:
    post:
      operationId: signUpByPhone
      summary: Sign up with a phone. A code to confirm the number is sent to it.
      description: >
        The body is `phoneFields` by name (`answers.<key>` nested under `answers`); the number is E.164 (spaces, dashes and
        a leading 00 are taken; 422 on `phone` otherwise). Answers 202 the same whether or not the number already has an
        account (that person is told so instead); nothing is made until the code confirms it (verifyPhoneSignup). The
        account has no email: its person signs in with a code sent to that number. 409 when signing up with a phone is not offered.
        Slowed per number and per address (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, accountName]
              properties:
                captchaToken: { type: string, description: 'The bot check widget''s token, when the bot check guards signing up (brand `captcha.forms` has sign_up).' }
                name: { type: string }
                phone: { type: string }
                accountName: { type: string }
                answers: { type: object, additionalProperties: { type: string } }
                terms: { type: string, description: '"1" when the terms box is ticked.' }
      responses:
        '202':
          description: Asked; the same answer whatever the number.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }

  /api/kit/signup/email/verify:
    post:
      operationId: verifyEmailSignup
      summary: Confirm an email sign-up with its code (`emailCode` on getSignupForm). The account is made and the person signed in — or, in approval mode, the sign-up waits for staff.
      description: >
        A code works once, for a few minutes and a few tries; a newer sign-up's code replaces it. A wrong, used, expired
        or worn-out code answers the same 422 on `code`. 409 when sign-up is closed or confirms by link. Slowed per
        network address (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string }
      responses:
        '200':
          description: Confirmed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignupConfirmed' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }

  /api/kit/signup/phone/verify:
    post:
      operationId: verifyPhoneSignup
      summary: Confirm a phone sign-up with its code. The account is made and the person signed in — or, in approval mode, the sign-up waits for staff.
      description: >
        A code works once, for a few minutes and a few tries; a newer sign-up's code replaces it. A wrong, used, expired
        or worn-out code answers the same 422 on `code`. 409 when signing up with a phone is not offered, or the number
        got an account meanwhile. Slowed per address (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        '200':
          description: Confirmed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignupConfirmed' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }

  /api/kit/signup/provider:
    get:
      operationId: getProviderSignup
      summary: The sign-up waiting in this session for someone a sign-in provider vouched for, and its form.
      description: >
        Set by finishSso for a verified email with no account while sign-ups are open to it, for a while. None (never
        set, run out, its provider switched off, sign-ups no longer open to the address) answers 404.
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                type: object
                required: [provider, email, fields, terms]
                properties:
                  provider: { type: string, description: "The provider's name, as the operator calls it." }
                  email: { type: string, description: 'The address the provider verified; the account will use it.' }
                  fields: { type: array, items: { $ref: '#/components/schemas/SetupField' }, description: 'The form without an email or a password; the name suggested by the provider.' }
                  terms:
                    type: object
                    nullable: true
                    required: [url, version]
                    properties:
                      url: { type: string }
                      version: { type: string }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    post:
      operationId: signUpWithProvider
      summary: Sign up as the person a sign-in provider vouched for. The account is made and they are signed in — or, in approval mode, the sign-up waits for staff.
      description: >
        The body is the form's fields by name. The offer is spent at once; the provider's identity is remembered with the
        account, so the person signs in with it again. 404 when no offer waits in this session; 409 when the address got
        an account meanwhile. Slowed per address (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, accountName]
              properties:
                captchaToken: { type: string, description: 'The bot check widget''s token, when the bot check guards signing up (brand `captcha.forms` has sign_up).' }
                name: { type: string }
                accountName: { type: string }
                answers: { type: object, additionalProperties: { type: string } }
                terms: { type: string, description: '"1" when the terms box is ticked.' }
      responses:
        '200':
          description: Signed up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignupConfirmed' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }

  /api/kit/session/link:
    post:
      operationId: requestSignInLink
      summary: Ask for a link that signs a customer in.
      description: >
        Answers 202 the same whether or not a customer uses the address (staff never get one: they use their password);
        the link is made and emailed after the answer. 409 when the operator has this way in off, or email is off.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                captchaToken: { type: string, description: 'The bot check widget''s token, when the bot check guards this form (brand `captcha.forms`).' }
                email: { type: string, format: email }
      responses:
        '202':
          description: Asked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }

  /api/kit/session/link/{token}:
    post:
      operationId: useSignInLink
      summary: Sign in with an emailed link.
      description: The link works once; unknown, used and expired links answer the same 404.
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/kit/session/email-code:
    post:
      operationId: requestEmailCode
      summary: Email a sign-in code to a customer's address.
      description: >
        Answers the same whether or not a customer uses that address; the code is emailed after the answer, and a newer
        one replaces it. Staff sign in with a password, so no code goes to them. 409 when the operator has not turned
        emailed codes on or the kit cannot send email. Slowed per email address and per network address (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                captchaToken: { type: string, description: 'The bot check widget''s token, when the bot check guards this form (brand `captcha.forms`).' }
                email: { type: string, format: email }
      responses:
        '202':
          description: The same answer whatever the address.
          content:
            application/json:
              schema: { type: object, required: [message], properties: { message: { type: string } } }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }

  /api/kit/session/email-code/verify:
    post:
      operationId: useEmailCode
      summary: Sign in with an emailed code.
      description: >
        A code works once, for a few minutes and a few tries. A wrong, used, expired or worn-out code answers the same
        422 on `code`. 409 when emailed codes are off. Slowed per network address (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }

  /api/kit/session/code:
    post:
      operationId: requestSignInCode
      summary: Send a sign-in code to a customer's proven phone number, by text or WhatsApp (brand `signInCodeChannel`).
      description: >
        Answers the same whether or not a customer has proven that number; the code is sent after the answer. 409
        when the operator has not turned sign-in codes on or the kit has no sender; 422 on a number that is not
        E.164 (spaces, dashes and a leading 00 are taken). Slowed per number and per address (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                captchaToken: { type: string, description: 'The bot check widget''s token, when the bot check guards this form (brand `captcha.forms`).' }
                phone: { type: string }
      responses:
        '202':
          description: The same answer whatever the number.
          content:
            application/json:
              schema: { type: object, required: [message], properties: { message: { type: string } } }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }

  /api/kit/session/code/verify:
    post:
      operationId: useSignInCode
      summary: Sign in with a code sent to a phone.
      description: >
        A code works once, for a few minutes and a few tries; a newer one replaces it. A wrong, used, expired or
        worn-out code answers the same 422 on `code`. Slowed per address (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }

  /api/kit/oidc/{providerId}/start:
    parameters:
      - { name: providerId, in: path, required: true, schema: { type: string } }
    get:
      operationId: startSso
      summary: Go to an OpenID Connect provider to sign in (the console's "Continue with …" buttons).
      description: >
        302 to the provider's authorization endpoint with `state`, `nonce` and a PKCE challenge kept in this session.
        A provider that is unknown, disabled or cannot be read sends the browser back instead (303 to
        `<site>/console?signInError=unavailable`). Slowed per address (429).
      security: []
      responses:
        '302':
          description: On to the provider.
          headers:
            Location: { schema: { type: string } }
        '303':
          description: Back to the console with a reason.
          headers:
            Location: { schema: { type: string } }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/kit/oidc/callback:
    get:
      operationId: finishSso
      summary: Where every OpenID Connect provider sends the person back (the address to register at the provider).
      description: >
        Only a `state` this session started counts, once. The code is exchanged with the provider and its ID token
        checked (signature by a published key, issuer, audience, expiry, nonce). Then 303 to `<site>/console`, signed
        in — a customer known by this provider's subject, or by an email the provider verified — or, for a verified
        email with no account while sign-ups are open to it, to `<site>/signup?with=provider` to finish signing up
        (getProviderSignup), or to `<site>/console?signInError=<reason>`: expired, cancelled, unavailable, failed,
        not_verified, no_account (and sign-ups closed), not_allowed (sign-ups not open to this address), staff.
        Slowed per address (429).
      security: []
      parameters:
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        '303':
          description: Back to the console, signed in or with a reason.
          headers:
            Location: { schema: { type: string } }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/kit/account:
    get:
      operationId: getAccount
      summary: "The signed-in person's own account: name, email, phone number."
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/account/phone:
    post:
      operationId: requestPhoneCode
      summary: Send a code to a number the signed-in person is adding.
      description: >
        The number is theirs only once they prove it (verifyPhone). 409 when the kit cannot send texts; 422 on a number
        that is not E.164; 503 when no sender could send the text. Slowed per number and per address (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
      responses:
        '202':
          description: Texted.
          content:
            application/json:
              schema: { type: object, required: [message], properties: { message: { type: string } } }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: removePhone
      summary: Remove the signed-in person's phone number.
      description: 409 when it is their only way in (they signed up with it and have no email).
      security: []
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }

  /api/kit/account/phone/verify:
    post:
      operationId: verifyPhone
      summary: Prove a number with its code; it becomes the signed-in person's.
      description: >
        It leaves any other account that held it (numbers are reissued: whoever holds the phone owns the number). A
        wrong, used or expired code answers 422 on `code`. Slowed per address (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string }
      responses:
        '200':
          description: Proven.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/Error' }

  /api/kit/admin/customers:
    get:
      operationId: listCustomers
      summary: The operator's customers, newest first, from the kit's own database.
      description: >
        Staff only (401 signed out, 403 not staff), after the install (409 before it). Read from the kit's DB, never
        from Telenow (SELF_HOSTED_KIT_PLAN.md §3.8 b).
      security: []
      parameters:
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: One page of customers.
          content:
            application/json:
              schema:
                type: object
                required: [customers, total, page, perPage]
                properties:
                  customers: { type: array, items: { $ref: '#/components/schemas/Customer' } }
                  total: { type: integer }
                  page: { type: integer }
                  perPage: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    post:
      operationId: createCustomer
      summary: Add a customer — a Telenow sub-account with its own key.
      description: >
        Saved in the kit at once and sent to Telenow straight away. When Telenow cannot take it yet the customer is
        answered with `syncState: pending` and the kit keeps trying; when Telenow refuses it, `failed` with Telenow's
        reason. The customer's Telenow key never appears in any answer.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 160 }
      responses:
        '201':
          description: Added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/kit/admin/customers/{id}:
    get:
      operationId: getCustomer
      summary: One customer.
      security: []
      parameters: [{ $ref: '#/components/parameters/CustomerId' }]
      responses:
        '200':
          description: The customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/admin/customers/{id}/limits:
    put:
      operationId: setCustomerLimits
      summary: "Set the customer's limits at Telenow: the most calls at once and a monthly cap on Telenow's charges (USD); null for none."
      description: 409 for a customer being closed or closed.
      security: []
      parameters: [{ $ref: '#/components/parameters/CustomerId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [maxConcurrentCalls, monthlyCapUsd]
              properties:
                maxConcurrentCalls: { type: integer, minimum: 0, nullable: true }
                monthlyCapUsd: { type: string, nullable: true, description: 'Dollars with at most two decimals.' }
      responses:
        '200':
          description: Set in the kit, and at Telenow as far as `syncState` says.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/kit/admin/customers/{id}/close:
    post:
      operationId: closeCustomer
      summary: "Close the customer for good: suspended now, its numbers released, then the sub-account closed at Telenow."
      description: "`confirm` must be the customer's exact name (422 otherwise). It stays `closing` until its numbers are released, its live calls have ended and its last calls and fees are read and charged, usually minutes and at most a few hours, because closing revokes the key that reads them. The wallet is left as it is. 409 when already closing or closed."
      security: []
      parameters: [{ $ref: '#/components/parameters/CustomerId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string }
      responses:
        '200':
          description: Closing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/kit/admin/customers/{id}/view-as:
    post:
      operationId: viewAsCustomer
      summary: Look at the console as this customer sees it, read-only, for a while (the session says until when).
      security: []
      parameters: [{ $ref: '#/components/parameters/CustomerId' }]
      responses:
        '200':
          description: Started.
          content:
            application/json:
              schema:
                type: object
                required: [viewingAs]
                properties:
                  viewingAs: { $ref: '#/components/schemas/ViewingAs' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '419': { $ref: '#/components/responses/Error' }

  /api/kit/admin/customers/{id}/suspend:
    post:
      operationId: suspendCustomer
      summary: Suspend a customer — Telenow refuses their new calls and ends the live ones.
      description: 409 when the customer is already suspended.
      security: []
      parameters: [{ $ref: '#/components/parameters/CustomerId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500, nullable: true }
      responses:
        '200':
          description: Suspended in the kit, and at Telenow as far as `syncState` says.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/kit/admin/customers/{id}/resume:
    post:
      operationId: resumeCustomer
      summary: Lift a customer's suspension.
      description: 409 when the customer is not suspended.
      security: []
      parameters: [{ $ref: '#/components/parameters/CustomerId' }]
      responses:
        '200':
          description: Active in the kit, and at Telenow as far as `syncState` says.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/admin/customers/{id}/retry:
    post:
      operationId: retryCustomer
      summary: Send a customer's failed Telenow writes again.
      description: 409 when nothing failed.
      security: []
      parameters: [{ $ref: '#/components/parameters/CustomerId' }]
      responses:
        '200':
          description: Sent again; `syncState` says how it went.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/admin/customers/{id}/team:
    get:
      operationId: listCustomerTeam
      summary: A customer's members and pending invites.
      security: []
      parameters: [{ $ref: '#/components/parameters/CustomerId' }]
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/admin/customers/{id}/team/invites:
    post:
      operationId: inviteCustomerMember
      summary: Invite someone to a customer's account — how an account gets its first user.
      description: >
        Emails the invite when the platform can send email; otherwise answers its `token`, the link's secret, this once (only its hash is kept). A new invite for an email replaces that email's earlier pending one. 409 when the person is already a member.
      security: []
      parameters: [{ $ref: '#/components/parameters/CustomerId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, description: "One of the team's roles (owner, member, …)." }
      responses:
        '201':
          description: OK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteCreated' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/kit/admin/customers/{id}/team/invites/{inviteId}:
    delete:
      operationId: revokeCustomerInvite
      summary: Withdraw a pending invite.
      security: []
      parameters: [{ $ref: '#/components/parameters/CustomerId' }, { $ref: '#/components/parameters/InviteId' }]
      responses:
        '204': { description: Done. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/admin/customers/{id}/team/members/{userId}:
    delete:
      operationId: removeCustomerMember
      summary: Remove someone from a customer's account.
      description: >
        409 when they are its last manager.
      security: []
      parameters: [{ $ref: '#/components/parameters/CustomerId' }, { $ref: '#/components/parameters/UserId' }]
      responses:
        '204': { description: Done. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/admin/pricing:
    get:
      operationId: getPricing
      summary: "The operator's prices: the currency, the USD rate, the default plan and the price lists."
      description: >
        Customers are charged only once a currency, a rate and a default plan that exists are set (`inForce`). Staff only.
      security: []
      responses:
        '200':
          description: The prices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pricing' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    put:
      operationId: updatePricing
      summary: Set the currency, the USD rate and the default plan.
      description: >
        The currency cannot change once a price list or a wallet entry uses it. `usdRate` is how much of the currency one
        US dollar is (a decimal string above zero), stored with each charge.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency, usdRate]
              properties:
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                usdRate: { type: string }
                defaultPlan: { type: string, nullable: true }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pricing' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/kit/admin/pricing/low-balance:
    put:
      operationId: setLowBalanceDefault
      summary: Set the balance customers get a low-balance email at, unless they chose their own.
      description: >
        An amount in the platform's currency, zero or more, with at most its decimal places. Empty or null: none (a
        customer that chose no level of its own then gets only the out-of-credit email, at zero). Each email goes once
        when the balance falls to the level and again only after it is back above it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lowBalanceAt]
              properties:
                lowBalanceAt: { type: string, nullable: true }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pricing' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/kit/admin/pricing/lists/{listId}:
    put:
      operationId: savePriceList
      summary: Add or change a price list (one plan's prices).
      description: >
        `definition` is in the pricing spec's format (contract/pricing/price-list.schema.json), its `id` the one in the
        address and its currency the platform's. 422 names what is wrong with it. Calls no list could price are tried again.
      security: []
      parameters: [{ $ref: '#/components/parameters/ListId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, definition]
              properties:
                name: { type: string }
                definition: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceList' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deletePriceList
      summary: Delete a price list no customer, other list or default uses.
      security: []
      parameters: [{ $ref: '#/components/parameters/ListId' }]
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/admin/customers/{id}/wallet:
    get:
      operationId: getCustomerWallet
      summary: "A customer's wallet: balance, plan, spend limit, calls not yet charged, and entries with cost and margin."
      description: >
        Each charge shows what the voice platform charged for the call (`telenowCostUsd`) and the margin (the charge
        minus that cost at the charge's rate) — the operator's own figures, never shown to the customer.
      security: []
      parameters:
        - { $ref: '#/components/parameters/CustomerId' }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200':
          description: The wallet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerWallet' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/kit/admin/customers/{id}/wallet/credits:
    post:
      operationId: addCustomerCredit
      summary: Credit a customer by hand (a bank transfer, say).
      description: >
        `reference` (a UUID the form makes) makes the credit happen once: sent again, it answers the same entry with 200.
        409 while prices are not set. The customer's spend limit at the voice platform follows at once.
      security: []
      parameters: [{ $ref: '#/components/parameters/CustomerId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, reference]
              properties:
                amount: { type: string, description: 'Above zero, at most 8 decimals, such as "499.50".' }
                note: { type: string, nullable: true, maxLength: 200 }
                reference: { type: string, format: uuid }
      responses:
        '201':
          description: Credited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminWalletEntry' }
        '200':
          description: Credited before (the same reference).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminWalletEntry' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/kit/admin/customers/{id}/plan:
    put:
      operationId: setCustomerPlan
      summary: Put a customer on a plan (a price list), or back on the default (null).
      security: []
      parameters: [{ $ref: '#/components/parameters/CustomerId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priceListId]
              properties:
                priceListId: { type: string, nullable: true }
      responses:
        '200':
          description: The customer's wallet, on its new plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerWallet' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/kit/admin/catalog:
    get:
      operationId: getCatalogCuration
      summary: "The kit's copy of the voice platform's catalog with the operator's choices: what customers may pick, under which names, and the new-agent defaults."
      description: >
        The operator's page: the platform's own ids and names appear here (never on a customer's). A provider is offered
        only once the operator offers it, under a name that does not carry the platform's (`platformName`); an offered
        language model provider's models are offered until switched off.
      security: []
      responses:
        '200':
          description: The catalog and the choices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogCuration' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    put:
      operationId: saveCatalogCuration
      summary: Save which providers and models customers may pick, their names, and the new-agent defaults — all or nothing.
      description: >
        `kinds` maps llm / stt / tts to providers by the platform's id, each `{offered, name, models}` (models: language
        models only, by id, each `{offered, name}`); providers left out keep their choices. A default must be offered.
        409 before the catalog is first read. `transferAllowed`, when sent, is whether customers may set up transfers to a person;
        saving it off takes transfer off every agent that has it, within a few minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kinds, defaults]
              properties:
                kinds:
                  type: object
                  additionalProperties:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        offered: { type: boolean }
                        name: { type: string, nullable: true, maxLength: 120 }
                        models:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              offered: { type: boolean }
                              name: { type: string, nullable: true, maxLength: 120 }
                        settings:
                          type: object
                          description: "Which of its own settings customers may change, by key, and of one with options which (by the platform's value). None sent: those chosen before stay."
                          additionalProperties:
                            type: object
                            properties:
                              offered: { type: boolean }
                              options: { type: object, additionalProperties: { type: boolean } }
                defaults: { $ref: '#/components/schemas/StackIds' }
                realtime:
                  type: object
