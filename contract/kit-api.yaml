  /api/kit/console/agents/{agentId}/webhooks/{webhookId}/test:
    post:
      operationId: testAgentWebhook
      summary: Send a marked sample of one of its events to this address, and answer the latest tries.
      description: 409 when the service has test sends off, too many were sent in the last hour, or the address is not at the voice platform yet.
