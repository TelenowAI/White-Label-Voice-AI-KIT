# CI for the White-Label Voice AI Kit: the same suites as the kit's gate, on every pull request and every push to main.
#
# - laravel:   the Laravel suite on SQLite, on each PHP version composer.lock installs on.
# - databases: the suite on each other database the setup wizard offers (PostgreSQL 16, MariaDB 10.11 through both of
#              its connections, MySQL 8.0), each on a throwaway server that exists only for this job. Three tests need a
#              database with no tables, so each gets an empty database of its own first (docs/BUILD_NOTES.md: "On other
#              databases"), and must not skip there.
# - node:      the console's type check and tests, the contract tests (offline, against the recorded Telenow answers)
#              and the release check's tests.
# - release:   builds the release zip (scripts/release.mjs, which also runs scripts/check-release.mjs on it) and keeps
#              it as this run's artifact.
# - publish:   only for a tag v<VERSION>: once every job above passed on that commit, a GitHub release with the zip, its
#              sha256 and the version's CHANGELOG.md section.
#
# Nothing here talks to the real Telenow: the tests point it at https://telenow.test (tests/TestCase.php) and
# KIT_TELENOW_URL below sends anything else to a closed port. No job uses a cache, so nothing cached by one run can
# reach a published zip. Every action is pinned to a commit.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  KIT_TELENOW_URL: http://127.0.0.1:9
  PHP_EXTENSIONS: bcmath, intl, pdo_sqlite, pdo_mysql, pdo_pgsql

jobs:
  laravel:
    name: Laravel · PHP ${{ matrix.php }} · SQLite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    defaults:
      run:
        working-directory: laravel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - name: Install Composer packages
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Make a test .env
        run: cp .env.example .env && php artisan key:generate --no-interaction
      - name: Tests
        run: php vendor/bin/phpunit --display-skipped

  databases:
    name: Laravel · ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PostgreSQL 16
            image: postgres:16
            connection: pgsql
            port: 5432
            username: postgres
            health: pg_isready -h 127.0.0.1 -U postgres -d kit_test
          - name: MariaDB 10.11
            image: mariadb:10.11
            connection: mariadb
            port: 3306
            username: root
            health: healthcheck.sh --connect --innodb_initialized
          - name: MariaDB 10.11 (mysql connection)
            image: mariadb:10.11
            connection: mysql
            port: 3306
            username: root
            health: healthcheck.sh --connect --innodb_initialized
          - name: MySQL 8.0
            image: mysql:8.0
            connection: mysql
            port: 3306
            username: root
            health: mysqladmin ping -h 127.0.0.1 --silent
    services:
      db:
        image: ${{ matrix.image }}
        env:
          TZ: UTC
          POSTGRES_PASSWORD: throwaway-not-a-secret
          POSTGRES_DB: kit_test
          MARIADB_ROOT_PASSWORD: throwaway-not-a-secret
          MARIADB_DATABASE: kit_test
          MYSQL_ROOT_PASSWORD: throwaway-not-a-secret
          MYSQL_DATABASE: kit_test
        ports:
          - "${{ matrix.port }}:${{ matrix.port }}"
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
    env:
      DB_CONNECTION: ${{ matrix.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: throwaway-not-a-secret
    defaults:
      run:
        working-directory: laravel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - name: Install Composer packages
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Make a test .env
        run: cp .env.example .env && php artisan key:generate --no-interaction
      - name: Make two more empty databases
        run: |
          php -r '
            $pg = getenv("DB_CONNECTION") === "pgsql";
            $dsn = ($pg ? "pgsql" : "mysql").":host=".getenv("DB_HOST").";port=".getenv("DB_PORT").($pg ? ";dbname=kit_test" : "");
            $pdo = new PDO($dsn, getenv("DB_USERNAME"), getenv("DB_PASSWORD"), [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);
            foreach (["kit_wizard", "kit_empty"] as $db) { $pdo->exec("CREATE DATABASE {$db}"); echo "made {$db}\n"; }
          '
      - name: The setup wizard on an empty database
        run: php vendor/bin/phpunit --fail-on-skipped --filter test_a_database_server_is_connected_migrated_and_saved
        env:
          DB_DATABASE: kit_wizard
      - name: The tests that need a database with no tables
        run: php vendor/bin/phpunit --fail-on-skipped --filter 'test_after_the_install_a_failed_read_is_an_error|test_a_database_session_store_waits_for_its_table'
        env:
          DB_DATABASE: kit_empty
      - name: Tests
        run: php vendor/bin/phpunit --display-skipped
        env:
          DB_DATABASE: kit_test

  node:
    name: Console, contract and release check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, the version from package.json's packageManager
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Console type check
        run: pnpm --filter console exec tsc -b --force
      - name: Console tests
        run: pnpm --filter console test
      - name: Contract tests (offline)
        run: pnpm --filter contract test
      - name: Release check tests
        run: pnpm test:release

  release:
    name: Release zip
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: A tag names the version in laravel/VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(tr -d '[:space:]' < laravel/VERSION)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not laravel/VERSION (${version})"
            exit 1
          fi
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Build and check the release zip
        run: pnpm release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: |
            dist/voice-kit-*.zip
            dist/voice-kit-*.zip.sha256
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [laravel, databases, node, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          version="$(tr -d '[:space:]' < laravel/VERSION)"
          awk -v v="$version" 'index($0, "## [" v "]") == 1 { on = 1; next } /^## \[/ || /^\[.*\]: / { on = 0 } on' CHANGELOG.md > notes.md
          if [ -z "$(tr -d '[:space:]' < notes.md)" ]; then
            echo "::error::CHANGELOG.md has no section for ${version}"
            exit 1
          fi
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < laravel/VERSION)"
          gh release create "${GITHUB_REF_NAME}" dist/voice-kit-*.zip dist/voice-kit-*.zip.sha256 \
            --verify-tag --title "White-Label Voice AI Kit ${version}" --notes-file notes.md
